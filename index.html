<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#dc2626" />
  <meta name="description" content="RAKSHA AI — Arunachal Pradesh Disaster Survival Intelligence System" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RAKSHA AI" />
  
  <!-- Favicon & PWA Icons -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="/src/styles/main.css" />

  <title>रक्षा RAKSHA AI — Arunachal Pradesh Disaster Survival Intelligence</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header-bar {
      position: sticky;
      top: 0;
      z-index: 1100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: linear-gradient(90deg, #0f172a, #1e293b);
      border-bottom: 1px solid #334155;
      backdrop-filter: blur(10px);
    }
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1100;
      display: flex;
      justify-content: space-around;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid #334155;
      backdrop-filter: blur(12px);
      padding: 8px 0;
    }
    .nav-item {
      background: transparent;
      border: none;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.72rem;
      cursor: pointer;
      flex: 1;
      transition: all 0.2s ease;
    }
    .nav-item.active {
      color: #ef4444;
      font-weight: bold;
    }
    .nav-item span {
      font-size: 1.35rem;
      margin-bottom: 2px;
    }
    .card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 12px;
    }
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    }
    .pulse-ring {
      width: 50px;
      height: 50px;
      border: 3px solid #ef4444;
      border-radius: 50%;
      animation: pulse-sos 1.5s infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes pulse-sos {
      0% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
      100% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
    .lang-dropdown {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- Header -->
    <header class="header-bar">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #dc2626, #b91c1c); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.1rem; border: 1px solid #f87171;">
          🛡️
        </div>
        <div>
          <div style="font-weight: 900; font-size: 1.1rem; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;">
            <span>रक्षा RAKSHA AI</span>
            <span style="font-size: 0.65rem; background: #dc2626; color: white; padding: 2px 5px; border-radius: 4px; font-weight: bold;">AP DISASTER AI</span>
          </div>
          <div style="font-size: 0.7rem; color: #94a3b8;">Arunachal Pradesh Multi-Modal Survival System</div>
        </div>
      </div>

      <!-- Language Selector & Offline Indicator -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <select class="lang-dropdown" onchange="window.raksha.setLanguage(this.value)">
          <option value="en">🌐 English</option>
          <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
          <option value="ny">🏔️ Nyishi</option>
          <option value="adi">🏔️ Adi</option>
          <option value="gal">🏔️ Galo</option>
          <option value="mon">🏔️ Monpa</option>
          <option value="wan">🏔️ Wancho</option>
          <option value="tag">🏔️ Tagin</option>
          <option value="apa">🏔️ Apatani</option>
          <option value="tan">🏔️ Tangsa</option>
          <option value="noc">🏔️ Nocte</option>
          <option value="mis">🏔️ Mishmi</option>
          <option value="kha">🏔️ Khampti</option>
          <option value="sin">🏔️ Singpho</option>
          <option value="she">🏔️ Sherdukpen</option>
        </select>
        <div title="System Online & Telemetry Active" style="width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e;"></div>
      </div>
    </header>

    <!-- Persona Selector Bar (Local Resident vs Tourist vs Statewide Monitor) -->
    <div class="persona-bar">
      <button class="persona-btn active" data-persona="resident" onclick="window.raksha.setPersona('resident')">
        <span>🏡</span> Local Resident
      </button>
      <button class="persona-btn" data-persona="tourist" onclick="window.raksha.setPersona('tourist')">
        <span>🧳</span> Tourist / Visitor
      </button>
      <button class="persona-btn" data-persona="monitor" onclick="window.raksha.setPersona('monitor')">
        <span>📡</span> Statewide Monitor
      </button>
    </div>

    <!-- Live Telemetry & Roadway Ticker Ribbon -->
    <div class="live-ticker">
      <div style="display: flex; align-items: center; gap: 8px; overflow: hidden;">
        <span class="live-badge"><span class="dot"></span> LIVE TELEMETRY</span>
        <span id="ticker-text" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
          NH-13 Restricted at Potin-Yazali (KM 48) • Sela Tunnel OPEN & All-Weather Safe • Siang River Surge Alert Active
        </span>
      </div>
      <button onclick="window.raksha.openHazardReportModal()" style="background: rgba(220, 38, 38, 0.25); border: 1px solid #ef4444; color: #fca5a5; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; font-weight: bold;">
        📢 Report Hazard
      </button>
    </div>

    <!-- Main Dynamic Content Area -->
    <main id="main-content" style="flex: 1; padding-bottom: 75px; overflow-y: auto;">
      <div class="loading-screen">
        <div class="pulse-ring"></div>
        <h2 style="font-size: 1.8rem; font-weight: 900; background: linear-gradient(90deg, #ef4444, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          रक्षा RAKSHA AI
        </h2>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 6px;">Initializing 28 Districts, Topo Maps & Mathematical Engines...</p>
      </div>
    </main>

    <!-- Bottom Navigation Bar (6 Pillars of Survival) -->
    <nav class="nav-bar">
      <button class="nav-item active" data-tab="dashboard" onclick="window.raksha.switchTab('dashboard')">
        <span>📊</span><span class="nav-label">Dashboard</span>
      </button>
      <button class="nav-item" data-tab="map" onclick="window.raksha.switchTab('map')">
        <span>🗺️</span><span class="nav-label">Live Map</span>
      </button>
      <button class="nav-item" data-tab="sim" onclick="window.raksha.switchTab('sim')">
        <span style="color: #c084fc;">🎬</span><span class="nav-label">Escape Model</span>
      </button>
      <button class="nav-item" data-tab="evacuate" onclick="window.raksha.switchTab('evacuate')">
        <span>🛣️</span><span class="nav-label">Escape Nav</span>
      </button>
      <button class="nav-item" data-tab="ai" onclick="window.raksha.switchTab('ai')">
        <span>🤖</span><span class="nav-label">Survival AI</span>
      </button>
      <button class="nav-item" data-tab="sos" onclick="window.raksha.switchTab('sos')">
        <span style="color: #ef4444;">🆘</span><span class="nav-label">SOS Beacon</span>
      </button>
      <button class="nav-item" data-tab="guide" onclick="window.raksha.switchTab('guide')">
        <span>📖</span><span class="nav-label">Guide</span>
      </button>
    </nav>
  </div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.warn);
      });
    }
  </script>

  <!-- Load Core Client Module -->
  <script type="module" src="/app.js"></script>
</body>
</html>
