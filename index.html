<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#dc2626" />
  <meta name="description" content="RAKSHA AI — Arunachal Pradesh Disaster Survival Intelligence System" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RAKSHA AI" />
  
  <!-- Favicon & PWA Icons -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="/src/styles/main.css" />

  <title>रक्षा RAKSHA AI — Arunachal Pradesh Disaster Survival Intelligence</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header-bar {
      position: sticky;
      top: 0;
      z-index: 1100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(8, 12, 22, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #dc2626 0%, #7f1d1d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      border: 1.5px solid rgba(248, 113, 113, 0.8);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }
    .brand-title {
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-badge {
      font-size: 0.62rem;
      background: #dc2626;
      color: white;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 0 8px rgba(220, 38, 38, 0.5);
    }
    .district-dropdown, .lang-dropdown {
      background: rgba(24, 24, 27, 0.85);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }
    .district-dropdown:hover, .lang-dropdown:hover {
      border-color: #ef4444;
      background: #18181b;
    }
    .status-dot-pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: blink 2s infinite;
      flex-shrink: 0;
    }
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: radial-gradient(circle at center, #1e1b4b 0%, #060913 70%);
    }
    .pulse-ring {
      width: 54px;
      height: 54px;
      border: 3px solid #ef4444;
      border-radius: 50%;
      animation: pulse-sos 1.5s infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes pulse-sos {
      0% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
      100% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- Luxury Glassmorphic Header -->
    <header class="header-bar">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="brand-icon">🛡️</div>
        <div>
          <div class="brand-title">
            <span>रक्षा RAKSHA AI</span>
            <span class="brand-badge">AP COGNITIVE CORE</span>
          </div>
          <div style="font-size: 0.68rem; color: #94a3b8;">Arunachal Pradesh Multi-Modal Mountain Intelligence</div>
        </div>
      </div>

      <!-- Quick Selectors: District & Language -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <select id="district-quick-select" class="district-dropdown" onchange="window.raksha.setDistrict(this.value)" title="Switch Active District">
          <option value="Papum Pare">📍 Papum Pare (Itanagar)</option>
          <option value="Tawang">📍 Tawang (Sela Tunnel)</option>
          <option value="West Kameng">📍 West Kameng (Bomdila)</option>
          <option value="Bichom">📍 Bichom (Napangphung)</option>
          <option value="East Kameng">📍 East Kameng (Seppa)</option>
          <option value="Pakke-Kessang">📍 Pakke-Kessang (Lemmi)</option>
          <option value="Lower Subansiri">📍 Lower Subansiri (Ziro)</option>
          <option value="Keyi Panyor">📍 Keyi Panyor (Yachuli)</option>
          <option value="Kurung Kumey">📍 Kurung Kumey (Koloriang)</option>
          <option value="Kra Daadi">📍 Kra Daadi (Jamin)</option>
          <option value="Upper Subansiri">📍 Upper Subansiri (Daporijo)</option>
          <option value="West Siang">📍 West Siang (Aalo)</option>
          <option value="Shi-Yomi">📍 Shi-Yomi (Mechuka)</option>
          <option value="Siang">📍 Siang (Boleng)</option>
          <option value="Upper Siang">📍 Upper Siang (Tuting)</option>
          <option value="East Siang">📍 East Siang (Pasighat)</option>
          <option value="Leparada">📍 Leparada (Basar)</option>
          <option value="Lower Siang">📍 Lower Siang (Likabali)</option>
          <option value="Dibang Valley">📍 Dibang Valley (Anini)</option>
          <option value="Lower Dibang Valley">📍 Lower Dibang Valley (Roing)</option>
          <option value="Lohit">📍 Lohit (Tezu)</option>
          <option value="Anjaw">📍 Anjaw (Hawai/Walong)</option>
          <option value="Namsai">📍 Namsai</option>
          <option value="Changlang">📍 Changlang</option>
          <option value="Tirap">📍 Tirap (Khonsa)</option>
          <option value="Longding">📍 Longding</option>
        </select>

        <select class="lang-dropdown" onchange="window.raksha.setLanguage(this.value)" title="Select Language">
          <option value="en">🌐 English</option>
          <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
          <option value="ny">🏔️ Nyishi</option>
          <option value="adi">🏔️ Adi</option>
          <option value="gal">🏔️ Galo</option>
          <option value="mon">🏔️ Monpa</option>
          <option value="wan">🏔️ Wancho</option>
          <option value="tag">🏔️ Tagin</option>
          <option value="apa">🏔️ Apatani</option>
          <option value="tan">🏔️ Tangsa</option>
          <option value="noc">🏔️ Nocte</option>
          <option value="mis">🏔️ Mishmi</option>
          <option value="kha">🏔️ Khampti</option>
          <option value="sin">🏔️ Singpho</option>
          <option value="she">🏔️ Sherdukpen</option>
        </select>
        <div class="status-dot-pulse" title="System Online & Telemetry Active"></div>
      </div>
    </header>

    <!-- Persona Selector Bar (Local Resident vs Tourist vs Statewide Monitor) -->
    <div class="persona-bar">
      <button class="persona-btn active" data-persona="resident" onclick="window.raksha.setPersona('resident')">
        <span>🏡</span> Local Resident
      </button>
      <button class="persona-btn" data-persona="tourist" onclick="window.raksha.setPersona('tourist')">
        <span>🧳</span> Tourist / Visitor
      </button>
      <button class="persona-btn" data-persona="monitor" onclick="window.raksha.setPersona('monitor')">
        <span>📡</span> Statewide Monitor
      </button>
    </div>

    <!-- Live Telemetry & Roadway Ticker Ribbon -->
    <div class="live-ticker">
      <div style="display: flex; align-items: center; gap: 8px; overflow: hidden;">
        <span class="live-badge"><span class="dot"></span> LIVE TELEMETRY</span>
        <span id="ticker-text" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
          NH-13 Restricted at Potin-Yazali (KM 48) • Sela Tunnel OPEN & All-Weather Safe • Siang River Surge Alert Active
        </span>
      </div>
      <button onclick="window.raksha.openHazardReportModal()" style="background: rgba(220, 38, 38, 0.25); border: 1px solid #ef4444; color: #fca5a5; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; font-weight: bold;">
        📢 Report Hazard
      </button>
    </div>

    <!-- Main Dynamic Content Area -->
    <main id="main-content" style="flex: 1; padding-bottom: 95px; overflow-y: auto;">
      <div class="loading-screen">
        <div class="pulse-ring"></div>
        <h2 style="font-size: 1.8rem; font-weight: 900; background: linear-gradient(90deg, #ef4444, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          रक्षा RAKSHA AI
        </h2>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 6px;">Initializing 28 Districts, Topo Maps & Mathematical Engines...</p>
      </div>
    </main>

    <!-- Floating Island Bottom Navigation Dock (6 Pillars of Survival) -->
    <nav class="nav-bar">
      <button class="nav-item active" data-tab="dashboard" onclick="window.raksha.switchTab('dashboard')" title="Dashboard">
        <span>📊</span><span class="nav-label">Dashboard</span>
      </button>
      <button class="nav-item" data-tab="map" onclick="window.raksha.switchTab('map')" title="Live Map">
        <span>🗺️</span><span class="nav-label">Live Map</span>
      </button>
      <button class="nav-item" data-tab="sim" onclick="window.raksha.switchTab('sim')" title="3D Escape Model">
        <span style="color: #c084fc;">🎬</span><span class="nav-label">3D Escape</span>
      </button>
      <button class="nav-item" data-tab="evacuate" onclick="window.raksha.switchTab('evacuate')" title="Escape Navigation">
        <span>🛣️</span><span class="nav-label">Escape Nav</span>
      </button>
      <button class="nav-item" data-tab="ai" onclick="window.raksha.switchTab('ai')" title="Survival AI">
        <span>🤖</span><span class="nav-label">Survival AI</span>
      </button>
      <button class="nav-item" data-tab="sos" onclick="window.raksha.switchTab('sos')" title="SOS Beacon">
        <span style="color: #ef4444;">🆘</span><span class="nav-label">SOS Beacon</span>
      </button>
      <button class="nav-item" data-tab="guide" onclick="window.raksha.switchTab('guide')" title="Survival Manual">
        <span>📖</span><span class="nav-label">Manual</span>
      </button>
    </nav>
  </div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.warn);
      });
    }
  </script>

  <!-- Load Core Client Module -->
  <script type="module" src="/app.js"></script>
</body>
</html>
