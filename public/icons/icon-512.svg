<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="#0f172a" />
  <!-- Outer Shield -->
  <path d="M 256 60 Q 380 90 410 170 C 410 320 256 430 256 450 C 256 430 102 320 102 170 Q 132 90 256 60 Z" 
        fill="url(#shieldGrad)" stroke="#f87171" stroke-width="8" />
  <!-- Inner Mountains of Arunachal -->
  <polygon points="256,160 330,290 182,290" fill="#ffffff" opacity="0.9" />
  <polygon points="190,210 260,320 120,320" fill="url(#mountainGrad)" opacity="0.8" />
  <polygon points="320,220 390,320 250,320" fill="url(#mountainGrad)" opacity="0.8" />
  <!-- Emergency Pulse Dot -->
  <circle cx="256" cy="370" r="24" fill="#22c55e" stroke="#ffffff" stroke-width="4" />
  <!-- Text Label -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">RAKSHA</text>
</svg>
